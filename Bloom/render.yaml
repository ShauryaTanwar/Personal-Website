services:
  - type: web
    name: bloom-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloom-database
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: bloom-database
    plan: free
    databaseName: bloom
    user: bloom


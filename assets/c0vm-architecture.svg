<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
<title id="t">Retro C0VM architecture diagram</title><desc id="d">A printed lab-manual style diagram showing bytecode entering a C0 virtual machine connected to stack, heap, and call frames.</desc>
<rect width="1000" height="560" fill="#efe5cc"/>
<g stroke="#8f856f" stroke-width="1" opacity=".25"><path d="M0 70h1000M0 140h1000M0 210h1000M0 280h1000M0 350h1000M0 420h1000M0 490h1000"/><path d="M100 0v560M200 0v560M300 0v560M400 0v560M500 0v560M600 0v560M700 0v560M800 0v560M900 0v560"/></g>
<rect x="34" y="28" width="932" height="504" rx="12" fill="none" stroke="#211e19" stroke-width="4"/>
<g font-family="Courier New, monospace" fill="#211e19"><text x="70" y="82" font-size="22" font-weight="700">LAB NOTE 02 / C0 VIRTUAL MACHINE</text><text x="70" y="112" font-size="14" fill="#514b42">instruction path and runtime storage</text></g>
<g stroke="#211e19" stroke-width="3" fill="#f7f0dc"><rect x="74" y="170" width="225" height="255" rx="8"/><rect x="389" y="155" width="240" height="285" rx="8"/><rect x="722" y="170" width="205" height="70" rx="7"/><rect x="722" y="270" width="205" height="70" rx="7"/><rect x="722" y="370" width="205" height="70" rx="7"/></g>
<g font-family="Courier New, monospace"><text x="100" y="205" font-size="18" font-weight="700" fill="#8b3f32">BYTECODE TAPE</text><text x="105" y="252" font-size="17" fill="#514b42">00  PUSH 5</text><text x="105" y="290" font-size="17" fill="#514b42">01  PUSH 3</text><rect x="96" y="307" width="175" height="34" rx="4" fill="#d6c37e"/><text x="105" y="331" font-size="17" fill="#211e19">02  IADD</text><text x="105" y="374" font-size="17" fill="#514b42">03  RETURN</text>
<text x="419" y="204" font-size="24" font-weight="700" fill="#211e19">C0VM</text><text x="419" y="250" font-size="16" fill="#514b42">decode instruction</text><text x="419" y="286" font-size="16" fill="#514b42">execute operation</text><text x="419" y="322" font-size="16" fill="#514b42">read / write memory</text><text x="419" y="358" font-size="16" fill="#514b42">advance program counter</text>
<text x="824" y="212" text-anchor="middle" font-size="17" font-weight="700" fill="#5e6b47">STACK</text><text x="824" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#5e6b47">HEAP</text><text x="824" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="#5e6b47">CALL FRAMES</text></g>

services:
  - type: web
    name: uncharted-api
    runtime: python
    rootDir: Uncharted/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://shauryatanwar.github.io,http://localhost:8000,http://127.0.0.1:8000
      - key: DAILY_AI_LIMIT
        value: 250
